version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Names fixed by docs/contracts.md §4: `service ViewOwner`,
    # `rpc Subscribe(stream OwnerRequest) returns (stream OwnerEvent)`.
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    # Wire and generated-code compatibility: no renumbering, no reuse, no type changes.
    - FILE
