# Local POC infrastructure. Starter configuration: tasks I-01..I-04 verify and finish it.
# Start:  npm run infra:up      Stop and wipe: npm run infra:down
name: atlas-realtime

x-redis-image: &redis-image redis:7.4

services:
  # ---------- Postgres 17: primary + streaming read replica (task I-01, see infra/postgres/README.md) ----------
  postgres-primary:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atlas
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      # Cap on WAL kept for a lagging slot. Exceeding it invalidates Debezium's slot (an incident).
      - -c
      - max_slot_wal_keep_size=4GB
      - -c
      - hot_standby_feedback=on
      # Logical walsenders (Debezium) never get ahead of the replica's physical slot, so a promoted
      # replica always has the failover slot at or past Debezium's position. The slot is created
      # by init/04-replica-slot.sql.
      - -c
      - synchronized_standby_slots=replica_1
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports: ["5432:5432"]
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - pg-primary:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during first-start init the image runs a socket-only temporary server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d atlas"]
      interval: 2s
      retries: 60

  postgres-replica:
    image: postgres:17
    environment:
      PGPASSWORD: replicator
    entrypoint: ["/bin/bash", "/replica/entrypoint.sh"]
    # Passed to `postgres` by the entrypoint. Keep wal_level=logical so slot synchronization works
    # and the replica can serve Debezium if promoted.
    command:
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_slot_wal_keep_size=4GB
      - -c
      - hot_standby=on
      - -c
      - hot_standby_feedback=on
      # Postgres 17 failover slots: keep a synchronized copy of every slot created with failover=true.
      - -c
      - sync_replication_slots=on
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports: ["5433:5432"]
    volumes:
      - ./postgres/replica:/replica:ro
      - pg-replica:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d atlas"]
      interval: 2s
      retries: 60

  # ---------- Redis: primary + replica + 3 Sentinels + master-only proxy (task I-02, see infra/redis/README.md) ----------
  # Configs are copied into each container's /data on FIRST start only. Sentinel rewrites them on
  # failover (replicaof, known replicas), and a restart must keep that, or a restarted old master
  # would come back as a second master. After editing redis/*.conf, run `npm run infra:down`.
  # The nodes are not published on the host: after a failover "redis-primary" may be a replica.
  # Apps use the proxy (localhost:6380); for direct access use `docker compose exec redis-primary redis-cli`.
  redis-primary:
    image: *redis-image
    entrypoint:
      - /bin/sh
      - -c
      - >-
        [ -f /data/redis.conf ] || cp /config/redis.conf /data/redis.conf;
        exec redis-server /data/redis.conf --replica-announce-ip redis-primary
    volumes:
      - ./redis/redis.conf:/config/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  redis-replica:
    image: *redis-image
    entrypoint:
      - /bin/sh
      - -c
      - >-
        [ -f /data/redis.conf ] || { cp /config/redis.conf /data/redis.conf && echo "replicaof redis-primary 6379" >> /data/redis.conf; };
        exec redis-server /data/redis.conf --replica-announce-ip redis-replica
    volumes:
      - ./redis/redis.conf:/config/redis.conf:ro
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  sentinel-1: &sentinel
    image: *redis-image
    entrypoint:
      - /bin/sh
      - -c
      - >-
        [ -f /data/sentinel.conf ] || cp /config/sentinel.conf /data/sentinel.conf;
        exec redis-sentinel /data/sentinel.conf --sentinel announce-ip "$$(hostname)"
    hostname: sentinel-1
    volumes:
      - ./redis/sentinel.conf:/config/sentinel.conf:ro
      - ./redis/sentinel-reconfig.sh:/config/sentinel-reconfig.sh:ro
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
  sentinel-2:
    <<: *sentinel
    hostname: sentinel-2
  sentinel-3:
    <<: *sentinel
    hostname: sentinel-3

  # Debezium's Redis sink has no Sentinel support, so it connects through this proxy, which only
  # routes to the node that currently reports role:master and cuts sessions to a demoted node.
  redis-proxy:
    image: haproxy:3.2
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports: ["6380:6380", "8404:8404"]
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica:
        condition: service_healthy

  # ---------- Debezium Server: outbox -> Redis Streams (task I-03, see infra/debezium/README.md) ----------
  # One instance only: a replication slot serves one reader. Read position lives in Postgres
  # (debezium_offsets), so the container keeps no state.
  debezium:
    # The official image plus the Outbox Event Router jar on the classpath (see debezium/Dockerfile).
    build: ./debezium
    image: atlas-realtime/debezium-server:3.7.0.Final
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      - ./debezium/application.properties:/debezium/config/application.properties:ro
    depends_on:
      postgres-primary:
        condition: service_healthy
      # synchronized_standby_slots makes Debezium wait for the replica, so start after it.
      postgres-replica:
        condition: service_healthy
      redis-proxy:
        condition: service_started
    ports: ["8080:8080"]
    # Watchdog. When the Redis master is demoted mid-write, the Redis sink fails its engine
    # (JedisDataException "UNBLOCKED ... master -> replica") but the JVM keeps running, so
    # `restart:` never fires. This check does what an OpenShift liveness probe on /q/health/live
    # does: if liveness is DOWN after this JVM was UP once, or never came UP within 120 s, it sends
    # SIGTERM to the JVM; Debezium then restarts and resumes from its offset in Postgres.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          started=$$(stat -c %Y /proc/1);
          if curl -sf -m 3 localhost:8080/q/health/live > /dev/null; then touch /tmp/was-live-$$started; exit 0; fi;
          if [ -f /tmp/was-live-$$started ] || [ $$(( $$(date +%s) - started )) -gt 120 ]; then kill 1; fi;
          exit 1
      interval: 5s
      timeout: 5s
      retries: 3

volumes:
  pg-primary:
  pg-replica:
