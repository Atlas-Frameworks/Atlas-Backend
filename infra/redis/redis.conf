# Redis node config for the POC (task I-02).
bind 0.0.0.0
protected-mode no
port 6379
dir /data

# Durability: append-only file, fsync every second.
appendonly yes
appendfsync everysec

# Refuse writes unless at least one replica is connected and recent.
min-replicas-to-write 1
min-replicas-max-lag 10

# Never evict: worker-list heartbeats and streams must not disappear under memory pressure.
maxmemory 2gb
maxmemory-policy noeviction

# Start a (re)sync at once. The default waits 5 s for more replicas to batch with; with exactly one
# replica that only delays the moment the new master has a "good" replica after a failover.
repl-diskless-sync-delay 0
