# Sentinel config for the POC (task I-02). Copied to each Sentinel's /data on first start,
# because Sentinel rewrites it (known replicas, Sentinels, config epoch).
port 26379
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel monitor atlas redis-primary 6379 2
sentinel down-after-milliseconds atlas 5000
sentinel failover-timeout atlas 30000
sentinel parallel-syncs atlas 1
# Demote the old master as soon as a failover ends (see the script).
sentinel client-reconfig-script atlas /config/sentinel-reconfig.sh
