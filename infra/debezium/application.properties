# Debezium Server 3.7: Postgres outbox -> Redis Streams (task I-03, see infra/debezium/README.md).
# Rationale for each setting: docs/architecture-plan.md, section "Write path".
# Every property name below was checked against the 3.7.0.Final image: Kafka Connect logs
# "... was supplied but isn't a known config" for unknown names, and none are logged.

# ---------- Sink: Redis Streams, through the master-only proxy ----------
debezium.sink.type=redis
debezium.sink.redis.address=redis-proxy:6380
debezium.sink.redis.batch.size=500
# "extended": each stream entry has fields `key` and `value` (contracts §2: field `value` holds the
# payload JSON). The default "compact" format uses the record key as the field name instead.
debezium.sink.redis.message.format=extended
# Wait for the replica to acknowledge (WAIT 1); retry instead of logging and carrying on.
debezium.sink.redis.wait.enabled=true
debezium.sink.redis.wait.timeout.ms=1000
debezium.sink.redis.wait.retry.enabled=true
debezium.sink.redis.wait.retry.delay.ms=500
# Retry Redis errors (connection cut by the proxy, NOREPLICAS, READONLY) with backoff.
debezium.sink.redis.retry.initial.delay.ms=300
debezium.sink.redis.retry.max.delay.ms=5000
debezium.sink.redis.null.key=default
debezium.sink.redis.null.value=default

# ---------- Source: Postgres, outbox table only ----------
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres-primary
debezium.source.database.port=5432
debezium.source.database.user=debezium
debezium.source.database.password=debezium
debezium.source.database.dbname=atlas
debezium.source.topic.prefix=atlas
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=atlas_outbox
debezium.source.publication.name=atlas_outbox
debezium.source.publication.autocreate.mode=disabled
debezium.source.table.include.list=public.outbox
debezium.source.snapshot.mode=no_data
debezium.source.tombstones.on.delete=false
# Hand batches to the sink every 100 ms instead of 500 ms: commit-to-stream p99 must stay under 1 s.
debezium.source.poll.interval.ms=100
# No __DEBEZIUM.CONTEXT.* headers: the Redis sink's extended format would store each one as an
# extra stream field (~300 bytes per entry).
debezium.source.extended.headers.enabled=false
# Postgres 17 failover slot, so the replica keeps a synchronized copy (infra/postgres/README.md).
debezium.source.slot.failover=true
# After a database failover, if the stored offset and the slot disagree, trust the stored offset
# (and fail if the slot is behind it) rather than silently skipping ahead to the slot position.
debezium.source.offset.mismatch.strategy=trust_offset

# Keep the slot advancing when nothing changes: emit a logical message every 10 s. The message
# itself is excluded from the change stream; only the slot position matters.
debezium.source.heartbeat.interval.ms=10000
debezium.source.heartbeat.action.query=SELECT pg_logical_emit_message(false, 'heartbeat', now()::varchar)
debezium.source.message.prefix.exclude.list=heartbeat

# ---------- Read position stored in Postgres (survives a total Redis loss) ----------
debezium.source.offset.storage=io.debezium.storage.jdbc.offset.JdbcOffsetBackingStore
debezium.source.offset.storage.jdbc.connection.url=jdbc:postgresql://postgres-primary:5432/atlas
debezium.source.offset.storage.jdbc.connection.user=debezium
debezium.source.offset.storage.jdbc.connection.password=debezium
debezium.source.offset.storage.jdbc.table.name=debezium_offsets
# Flush every 2 s so a crash replays seconds of events, not a minute.
debezium.source.offset.flush.interval.ms=2000

# ---------- Transforms ----------
# outbox:          Outbox Event Router; routes each event to topic outbox.event.<aggregatetype>
# toStream:        renames that topic to the Redis stream name changes:<aggregatetype>
# dropHeaders:     drops the router's `id` header (the outbox row id), which would be one more stream field
#
# Why two steps: the router's placeholder ${routedByValue} can't be written in this file. Quarkus
# (SmallRye Config) expands ${...} in property values, and Debezium Server re-reads debezium.* as
# quarkus.debezium.*, so neither "$${" nor "\\${" escapes survive (both fail with SRCFG00011).
# The router's default replacement, outbox.event.${routedByValue}, lives in code, not config.
debezium.transforms=outbox,toStream,dropHeaders

debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.predicate=isOutbox
debezium.transforms.outbox.route.by.field=aggregatetype
debezium.transforms.outbox.table.field.event.key=aggregateid
debezium.transforms.outbox.table.field.event.payload=payload
debezium.transforms.outbox.table.op.invalid.behavior=error
# Keep the payload as the jsonb text, unparsed. expand.json.payload=true re-parses it into a Connect
# struct and DROPS null fields ("affectedRoots": null, "map": null), so entries would no longer equal
# the committed payload (contracts §1).
debezium.transforms.outbox.table.expand.json.payload=false

debezium.transforms.toStream.type=org.apache.kafka.connect.transforms.RegexRouter
debezium.transforms.toStream.regex=outbox\\.event\\.(.+)
debezium.transforms.toStream.replacement=changes:$1

debezium.transforms.dropHeaders.type=org.apache.kafka.connect.transforms.DropHeaders
debezium.transforms.dropHeaders.headers=id

# Heartbeat records (topic __debezium-heartbeat.atlas) must NOT be filtered out here: the engine only
# commits offsets (and so advances the slot) for records the sink processes. The Redis sink
# recognises the heartbeat prefix, writes nothing for them and marks them processed.
debezium.predicates=isOutbox
debezium.predicates.isOutbox.type=org.apache.kafka.connect.transforms.predicates.TopicNameMatches
debezium.predicates.isOutbox.pattern=atlas\\.public\\.outbox

# Write the payload text and the entity id as-is: stream field `value` = the payload JSON exactly as
# committed, field `key` = the bare aggregateid (no JSON quoting).
debezium.format.value=simplestring
debezium.format.key=simplestring

quarkus.log.level=INFO
# Plain-text logs locally (the image defaults to JSON).
quarkus.log.console.json.enabled=false
