# Master-only Redis endpoint (task I-02, see infra/redis/README.md).
# Debezium's Redis sink cannot follow a Sentinel failover, so it connects here instead.
# HAProxy health-checks each Redis node every 500 ms and only routes to the one reporting
# role:master. When a node stops being master, its existing sessions are cut, so clients
# reconnect and land on the new master.

global
  log stdout format raw local0

# Docker's embedded DNS: container IPs change when containers are recreated.
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s
  hold nx 5s
  hold other 5s

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 2s
  timeout client 1h
  timeout server 1h
  timeout check 500ms

frontend redis_master
  bind *:6380
  default_backend redis_nodes

backend redis_nodes
  # "first": all traffic to the first server that is up. There should only ever be one master;
  # if two briefly report role:master (split brain), this still sends everything to one of them.
  balance first
  option tcp-check
  tcp-check connect
  # Send everything first: QUIT makes Redis close the connection after replying, so a node that
  # is not master fails the check at once instead of waiting for "timeout check".
  tcp-check send PING\r\n
  tcp-check send info\ replication\r\n
  tcp-check send QUIT\r\n
  tcp-check expect string +PONG
  tcp-check expect string role:master
  tcp-check expect string +OK
  # fall 2 x inter 500ms: a demoted node is taken out within ~1 s; rise 2: a new master is used after ~1 s.
  # init-addr none: start even if a node can't be resolved yet (container down).
  default-server check inter 500ms fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
  server redis-primary redis-primary:6379
  server redis-replica redis-replica:6379

frontend stats
  mode http
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 2s
  stats show-legends
