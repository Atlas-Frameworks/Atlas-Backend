# Master-only Redis endpoint for Debezium (task I-02).
# Debezium's Redis sink cannot follow a Sentinel failover, so it connects here instead.
# HAProxy health-checks each Redis node and only routes to the one reporting role:master.

global
  log stdout format raw local0

defaults
  mode tcp
  timeout connect 3s
  timeout client 1h
  timeout server 1h
  log global

frontend redis_master
  bind *:6380
  default_backend redis_nodes

backend redis_nodes
  option tcp-check
  tcp-check connect
  tcp-check send PING\r\n
  tcp-check expect string +PONG
  tcp-check send info\ replication\r\n
  tcp-check expect string role:master
  tcp-check send QUIT\r\n
  tcp-check expect string +OK
  server redis-primary redis-primary:6379 check inter 1s fall 2 rise 2 on-marked-down shutdown-sessions
  server redis-replica redis-replica:6379 check inter 1s fall 2 rise 2 on-marked-down shutdown-sessions

frontend stats
  mode http
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s
