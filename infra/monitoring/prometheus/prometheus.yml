# Prometheus for the local POC (task I-05). See infra/monitoring/README.md.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # view-service workers run on the host in local dev (npm run dev:cluster).
  # PENDING S-09: workers do not serve /metrics yet, so these targets stay down until then.
  - job_name: view-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels: { worker: view-service-0 }
      - targets: ["host.docker.internal:3010"]
        labels: { worker: view-service-1 }
      - targets: ["host.docker.internal:3020"]
        labels: { worker: view-service-2 }

  # PENDING S-09 / W-03: replicator-sim metrics endpoint.
  - job_name: replicator-sim
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3100"]

  # Debezium Server has no Quarkus /q/metrics endpoint; the image's Prometheus JMX exporter agent
  # is enabled by JMX_EXPORTER_PORT=9404 (see the debezium service in docker-compose.yml).
  - job_name: debezium
    static_configs:
      - targets: ["debezium:9404"]

  # One redis_exporter, multi-target: each Redis node is scraped directly, so memory and traffic
  # are per node, whichever is master (redis_instance_info{role}).
  - job_name: redis
    metrics_path: /scrape
    static_configs:
      - targets: ["redis://redis-primary:6379", "redis://redis-replica:6379"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: "redis://([^:]+):.*"
        target_label: instance
      - target_label: __address__
        replacement: redis-exporter:9121

  # The exporter's own health.
  - job_name: redis-exporter
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter-primary:9187"]
        labels: { instance: postgres-primary }
      - targets: ["postgres-exporter-replica:9187"]
        labels: { instance: postgres-replica }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
